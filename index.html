<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>출동! AI 구조대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c2b3a; --felt:#1F6B52; --felt-d:#17513f; --felt-l:#2a7f63; --paper:#fffdf7;
  --E:#3E86D6; --N:#2E9E5B; --Y:#E0672F;
  --cpu:#8CC8F4; --gpu:#94E0A8; --mem:#C9B0F4; --sto:#F7B06B; --net:#4FD0CE;
  --cpu-d:#6BB8F0; --gpu-d:#7ED99A; --mem-d:#B895F0; --sto-d:#F5963A; --net-d:#2EC4C4;
  --ch:170px; --cw:calc(var(--ch) * 63 / 88);
  --head:'Jua','Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--felt);color:var(--ink);font-family:var(--body);word-break:keep-all;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:disabled{cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
img{display:block;max-width:100%}
#app{height:100%;height:100dvh}

.game,.card.big,.card.mini{--cw:calc(var(--ch) * 63 / 88)}

/* ---------- 공통 버튼 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:14px;
  background:#fff;border:2px solid var(--ink);font-weight:800;font-size:16px;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:#ffd54a}
.btn.go{background:#ff7a59;color:#fff;font-family:var(--head);font-size:20px;font-weight:400;letter-spacing:.5px}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.7);box-shadow:none;min-height:38px;padding:4px 14px;font-size:14px}
.btn.small{min-height:38px;padding:4px 12px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45;box-shadow:0 3px 0 rgba(28,43,58,.4)}

/* ---------- 시작 화면 ---------- */
.setup{height:100%;overflow:auto;display:flex;padding:16px;
  background:radial-gradient(circle at 50% 0,var(--felt-l),var(--felt) 60%)}
.setup-card{margin:auto;width:min(680px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:26px;padding:20px 26px 18px;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.logo{font-family:var(--head);font-weight:400;font-size:40px;line-height:1.05;margin:0;color:var(--felt);text-align:center}
.logo small{display:block;font-family:var(--body);font-size:15px;font-weight:700;color:#55636f;margin-top:8px}
.story{background:#EAF4FD;border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.55;margin:12px 0 0}
.field{margin-top:13px}
.field>label,.field>.lab{display:block;font-weight:900;font-size:15px;margin-bottom:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;min-height:48px;border:2px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;font-size:16px;padding:6px 10px}
.seg button small{display:block;font-size:12px;font-weight:600;color:#55636f}
.seg button.on{background:var(--felt);color:#fff}
.seg button.on small{color:#d6efe5}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.names label{display:flex;align-items:center;gap:8px;border:2px solid var(--ink);border-radius:14px;background:#fff;padding:4px 10px}
.names .dot{flex:none;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.names input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:16px;font-weight:700;padding:8px 0;background:transparent}
.setup-btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.setup-btns .btn{flex:1;min-height:54px}
.note{font-size:12.5px;color:#6b7781;margin:10px 0 0;text-align:center}

/* ---------- 게임 화면 ---------- */
.game{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 296px;grid-template-rows:auto minmax(0,1fr);
  background:radial-gradient(circle at 40% 30%,var(--felt-l),var(--felt) 70%)}
.hd{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--felt-d);color:#fff;min-height:48px}
.hd h1{font-family:var(--head);font-weight:400;font-size:21px;margin:0;white-space:nowrap}
.chip{font-size:13px;font-weight:800;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.warn{background:#ff7a59}
.news{flex:1;min-width:0;font-size:13.5px;opacity:.95;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.table{min-width:0;min-height:0;display:flex;flex-direction:column;padding:10px 4px 10px 12px;gap:10px}
.game.side .table{flex-direction:row}
.board{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.row{display:flex;justify-content:center;gap:8px}
.slot{width:var(--cw);height:var(--ch);flex:none;border-radius:calc(var(--ch) * .055)}
.slot.empty{border:2px dashed rgba(255,255,255,.35)}

/* 더미(카드 뒷면) */
.deck{background:var(--sc);padding:calc(var(--ch) * .03);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.deck>div{height:100%;border:1.5px solid rgba(255,255,255,.7);border-radius:calc(var(--ch) * .04);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:calc(var(--ch) * .035);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 10px,rgba(255,255,255,0) 10px 20px)}
.deck b{font-size:calc(var(--ch) * .105);font-weight:900;background:#fff;color:var(--sc);border-radius:999px;padding:1px calc(var(--ch) * .07)}
.deck span{font-size:calc(var(--ch) * .062);line-height:1.3;padding:0 4px}
.deck i{font-style:normal;font-weight:900;font-size:calc(var(--ch) * .078)}

/* 인공지능 카드 */
.card{position:relative;display:flex;flex-direction:column;background:#fff;border:calc(var(--ch) * .011 + 1px) solid var(--ink);padding:calc(var(--ch) * .028);
  box-shadow:0 3px 0 rgba(0,0,0,.28);text-align:left;transition:transform .12s}
button.card:active{transform:scale(.97)}
.card.can{box-shadow:0 0 0 3px #ffd54a,0 3px 0 3px rgba(0,0,0,.28)}
.card.can::after{content:'출동 가능';position:absolute;left:50%;top:calc(var(--ch) * -.045);transform:translateX(-50%);background:#ffd54a;border:1.5px solid var(--ink);
  border-radius:999px;font-size:calc(var(--ch) * .058);font-weight:900;padding:0 calc(var(--ch) * .04);white-space:nowrap;line-height:1.5}
.card.fresh{animation:deal .45s ease-out}
@keyframes deal{from{transform:translateY(-18px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.c-top{display:flex;justify-content:space-between;align-items:flex-start}
.c-bn{border:1.5px solid var(--ink);border-radius:calc(var(--ch) * .022);padding:calc(var(--ch) * .008);background:#EAF4FD;line-height:0}
.c-bn img{height:calc(var(--ch) * .088);width:auto}
.c-pt{font-weight:900;font-size:calc(var(--ch) * .088);line-height:1;text-align:right}
.c-pt i{display:block;font-style:normal;font-size:calc(var(--ch) * .052);font-weight:800;margin-bottom:calc(var(--ch) * .008)}
.st-E .c-pt i{color:var(--E)} .st-N .c-pt i{color:var(--N)} .st-Y .c-pt i{color:var(--Y)}
.c-tt{text-align:center;font-weight:900;letter-spacing:-.4px;font-size:calc(var(--ch) * .066);line-height:1.15;margin:calc(var(--ch) * .012) 0 0;
  min-height:calc(var(--ch) * .152);display:flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:.25em}
.c-ln{display:none;text-align:center;font-size:calc(var(--ch) * .042);line-height:1.3;color:#333;font-weight:500;min-height:calc(var(--ch) * .11)}
.c-pic{flex:1;min-height:0;width:100%;object-fit:contain;margin:calc(var(--ch) * .008) 0 calc(var(--ch) * .014)}
.c-cost{display:grid;grid-template-columns:repeat(5,1fr);gap:calc(var(--ch) * .012)}
.cc{text-align:center}
.cc img{height:calc(var(--ch) * .058);width:auto;margin:0 auto calc(var(--ch) * -.016);position:relative;z-index:1}
.cc b{display:block;border-radius:calc(var(--ch) * .022);font-size:calc(var(--ch) * .088);font-weight:900;line-height:1.3;padding-top:calc(var(--ch) * .008)}
.cc.zero{opacity:.38}
.r-cpu b,.bg-cpu{background:var(--cpu)} .r-gpu b,.bg-gpu{background:var(--gpu)} .r-mem b,.bg-mem{background:var(--mem)} .r-sto b,.bg-sto{background:var(--sto)} .r-net b,.bg-net{background:var(--net)}
.card.big{--ch:min(58vh,440px);width:var(--cw);height:var(--ch);flex:none;border-radius:calc(var(--ch) * .055);box-shadow:0 5px 0 rgba(0,0,0,.2)}
.card.big .c-ln{display:block}
.card.big .c-tt{min-height:0;margin:calc(var(--ch) * .02) 0 calc(var(--ch) * .01)}
.card.mini{--ch:150px;width:var(--cw);height:var(--ch);flex:none;border-radius:8px}

/* 가운데 자원 */
.bank{flex:none;display:flex;gap:10px;align-items:stretch;background:rgba(0,0,0,.2);border-radius:18px;padding:8px 10px}
.piles{display:flex;gap:8px;flex:none}
.pile{position:relative;width:78px;border-radius:14px;background:#fff;border:3px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px 2px 4px;box-shadow:0 3px 0 rgba(0,0,0,.28);transition:transform .1s}
.pile:active:not(:disabled){transform:translateY(2px)}
.pile img{height:34px;width:auto}
.pile b{font-size:13px;font-weight:900;white-space:nowrap;letter-spacing:-.4px;margin-top:2px}
.pile .cnt{font-size:13px;font-weight:800;color:#55636f}
.pile.out{opacity:.4}
.pile.picked{transform:translateY(-6px);box-shadow:0 0 0 3px #ffd54a,0 6px 0 3px rgba(0,0,0,.28)}
.pile .pk{position:absolute;top:-10px;right:-8px;min-width:28px;height:28px;border-radius:999px;background:#ffd54a;border:2px solid var(--ink);font-style:normal;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.b-cpu{border-color:var(--cpu-d)} .b-gpu{border-color:var(--gpu-d)} .b-mem{border-color:var(--mem-d)} .b-sto{border-color:var(--sto-d)} .b-net{border-color:var(--net-d)}
.actions{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.guide{margin:0;color:#fff;font-size:14.5px;line-height:1.4;font-weight:600}
.guide b{color:#ffd54a}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.game.side .bank{flex-direction:column;width:158px;padding:10px 8px}
.game.side .piles{flex-direction:column;gap:6px}
.game.side .pile{width:100%;flex-direction:row;justify-content:flex-start;gap:6px;padding:4px 8px;min-height:50px}
.game.side .pile img{height:30px;width:38px;object-fit:contain}
.game.side .pile b{margin:0;flex:1;text-align:left}
.game.side .pile.picked{transform:translateX(6px)}
.game.side .actions{justify-content:flex-end}
.game.side .guide{font-size:13px}
.game.side .btns{flex-direction:column}
.game.side .btns .btn{width:100%}

/* 구조대원(플레이어) */
.players{min-height:0;overflow:auto;padding:10px 12px 10px 8px;display:flex;flex-direction:column;gap:8px}
.pl{flex:1;max-height:176px;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:4px;background:var(--paper);border:2.5px solid var(--ink);border-radius:16px;padding:7px 9px 8px;text-align:left;width:100%;opacity:.86}
.pl.turn{opacity:1;box-shadow:0 0 0 4px #ffd54a}
.pl-top{display:flex;align-items:center;gap:6px}
.pl-dot{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.pl-name{flex:1;min-width:0;font-weight:900;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-turn{font-size:11.5px;font-weight:900;background:#ffd54a;border-radius:999px;padding:1px 8px;white-space:nowrap}
.pl-score{font-family:var(--head);font-size:24px;line-height:1;white-space:nowrap}
.pl-score small{font-size:13px}
.pl-res{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rt{position:relative;border-radius:9px;padding:3px 2px 2px;text-align:center;line-height:1}
.rt img{height:17px;width:auto;margin:0 auto 1px;mix-blend-mode:multiply}
.rt b{font-size:17px;font-weight:900}
.rt.zero b{opacity:.35}
.rt .bo{display:block;margin:2px 1px 0;white-space:nowrap;background:var(--ink);color:#fff;border-radius:999px;font-size:10px;letter-spacing:-.6px;font-weight:800;padding:2px 0;font-style:normal}
.rt .bo.none{visibility:hidden}
.pl-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#55636f;gap:4px}
.stg{display:inline-flex;gap:5px}
.stg span{border-radius:999px;color:#fff;padding:2px 7px;font-size:11.5px;white-space:nowrap}
.sE{background:var(--E)} .sN{background:var(--N)} .sY{background:var(--Y)}
.c1{background:#EC4B8B} .c2{background:#2F7DE1} .c3{background:#F0663C} .c4{background:#22A35A}

/* 세로 화면 */
@media (orientation:portrait){
  .game{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}
  .players{flex-direction:row;flex-wrap:wrap;padding:8px 10px 0;overflow:visible}
  .pl{flex:1 1 calc(50% - 8px);max-height:none}
  .table{padding:10px}
  .bank{flex-wrap:wrap}
  .piles{flex:1;justify-content:center}
  .actions{flex-basis:100%}
  .hd h1{font-size:18px}
  .news{display:none}
  .hd{justify-content:space-between}
}
@media (max-width:1100px) and (orientation:landscape){ .game{grid-template-columns:minmax(0,1fr) 262px} .pile{width:70px} }

/* ---------- 모달 ---------- */
.ov{position:fixed;inset:0;background:rgba(10,30,24,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:var(--paper);border:3px solid var(--ink);border-radius:24px;padding:20px 22px;max-width:min(860px,100%);max-height:100%;overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.3)}
.modal h2{font-family:var(--head);font-weight:400;font-size:26px;margin:0 0 10px}
.modal p{line-height:1.6;margin:8px 0}
.m-btns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.dep{display:flex;gap:22px;align-items:center}
.dep-r{flex:1;min-width:0}
@media (max-width:700px){ .dep{flex-direction:column} .card.big{--ch:min(42vh,340px)} }
table.calc{border-collapse:separate;border-spacing:0 5px;width:100%;font-size:15px}
table.calc th,table.calc td{text-align:center;padding:5px 3px;font-weight:800}
table.calc th:first-child,table.calc td:first-child{text-align:left;white-space:nowrap;padding-right:8px}
table.calc thead img{height:22px;width:auto;margin:0 auto;mix-blend-mode:multiply}
table.calc thead th{font-size:11px;font-weight:800;border-radius:9px 9px 0 0;padding-top:6px}
table.calc tr.pay td{font-size:21px;font-weight:900;border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);background:#fff}
table.calc tr.pay td:first-child{border-left:2.5px solid var(--ink);border-radius:12px 0 0 12px;font-size:15px;padding-left:10px}
table.calc tr.pay td:last-child{border-right:2.5px solid var(--ink);border-radius:0 12px 12px 0}
table.calc .minus{color:#c0392b}
table.calc .lack{color:#c0392b;text-decoration:underline wavy}
table.calc .dim{opacity:.3}
.verdict{border-radius:14px;padding:10px 14px;font-weight:800;line-height:1.5;margin-top:10px}
.verdict.ok{background:#E3F6E8} .verdict.no{background:#FDE7E3}
.hint{font-size:13.5px;color:#55636f}
.disc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 4px}
.disc .dt{border-radius:14px;padding:8px 4px;text-align:center}
.disc .dt img{height:30px;width:auto;margin:0 auto 2px;mix-blend-mode:multiply}
.disc .dt b{display:block;font-size:13px;white-space:nowrap;letter-spacing:-.5px}
.disc .dt .have{font-size:12.5px;font-weight:700}
.step{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:6px}
.step button{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--ink);font-weight:900;font-size:20px;line-height:1}
.step button:disabled{opacity:.3}
.step span{min-width:22px;font-size:20px;font-weight:900}
.rules{padding-left:0;list-style:none;margin:0}
.rules li{display:flex;gap:10px;padding:8px 0;border-bottom:1.5px dashed #d9d3c3;line-height:1.55;font-size:15px}
.rules li>b{flex:none;width:76px;color:var(--felt)}
.mine{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.menu-list{display:flex;flex-direction:column;gap:10px;min-width:min(340px,80vw)}
.rank{width:100%;border-collapse:collapse;margin:12px 0;font-size:16px}
.rank th,.rank td{padding:5px 6px;text-align:center;border-bottom:1.5px solid #e2dccb}
.rank th{font-size:13px;color:#55636f}
.rank td:nth-child(2){text-align:left;font-weight:900}
.rank tr.win td{background:#FFF3C4}
.rank .tot{font-family:var(--head);font-size:22px}
.talk{background:#EAF4FD;border-radius:14px;padding:10px 16px 10px 34px;margin:8px 0 0;font-size:14px;line-height:1.5}
.crown{font-size:44px;text-align:center;line-height:1}
.toast{position:fixed;left:50%;top:6px;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:15.5px;line-height:1.45;padding:10px 20px;border-radius:999px;z-index:30;
  max-width:92vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35);animation:pop .22s ease-out;pointer-events:none}
@keyframes pop{from{transform:translate(-50%,-10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- 온라인: 첫 화면, 모둠 고르기, 대기실 ---------- */
.setup-card.wide{width:min(820px,100%)}
.codebox{display:flex;gap:10px}
.codebox input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:14px;font:inherit;font-family:var(--head);font-size:30px;letter-spacing:.3em;text-align:center;padding:6px 10px;background:#fff}
.codebox input::placeholder{font-family:var(--body);font-size:16px;letter-spacing:0;font-weight:700;color:#9aa5ad}
.codebox .btn{min-width:130px}
.pk-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h2{font-family:var(--head);font-weight:400;font-size:28px;margin:0;color:var(--felt);flex:1}
.chip.dark{background:#e7efe9;color:var(--felt-d)}
.names.one{grid-template-columns:minmax(0,340px)}
.seg.tight button{min-width:76px;flex:1 1 20%}
.note.left{text-align:left;font-size:13.5px;line-height:1.55}
.tbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.tb{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;min-height:112px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;box-shadow:0 3px 0 var(--ink)}
.tb:active{transform:translateY(3px);box-shadow:none}
.tb>b{font-family:var(--head);font-weight:400;font-size:22px;color:var(--felt)}
.tb-names{display:flex;flex-wrap:wrap;gap:4px;flex:1;align-content:flex-start}
.tb-names i{font-style:normal;font-size:13px;font-weight:700;background:#EAF4FD;border-radius:999px;padding:1px 8px}
.tb-names em{font-style:normal;font-size:13px;color:#8a959d}
.tb-st{font-size:12.5px;font-weight:800;color:#55636f}
.tb-st.play{color:#fff;background:var(--Y);border-radius:999px;padding:1px 9px}
.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.seat{display:flex;align-items:center;gap:8px;min-height:62px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 10px;flex-wrap:wrap}
.seat.empty{border-style:dashed;background:transparent}
.seat.mine{background:#FFF3C4}
.seat .dot{flex:none;width:28px;height:28px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.seat b{flex:1;min-width:0;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat em{flex:1;font-style:normal;color:#8a959d;font-weight:700}
.metag{font-style:normal;font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px;vertical-align:2px}
.conn{font-size:12px;font-weight:800;color:#c0392b;white-space:nowrap}
.conn.on{color:#1f8a4c}
@media (max-width:560px){.seats{grid-template-columns:minmax(0,1fr)}.codebox{flex-direction:column}}
.pl-me{font-size:11px;font-weight:900;background:var(--ink);color:#fff;border-radius:999px;padding:1px 7px}
.pl-off{font-size:11px;font-weight:900;background:#c0392b;color:#fff;border-radius:999px;padding:1px 7px}
.pl.me{background:#FFFBEA}
.game.wait .bank{opacity:.82}

/* ---------- 선생님 화면 ---------- */
.teach{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 40% 30%,var(--felt-l),var(--felt) 70%)}
.teach-body{flex:1;min-height:0;overflow:auto;padding:14px}
.codecard{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:12px 18px;margin-bottom:14px}
.codecard small{display:block;font-weight:800;font-size:13px;color:#55636f}
.codecard strong{font-family:var(--head);font-weight:400;font-size:54px;line-height:1;letter-spacing:.12em;color:var(--felt)}
.codecard p{flex:1;min-width:240px;margin:0;font-size:14.5px;line-height:1.55}
.tcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tc{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tc.play{box-shadow:0 0 0 3px #ffd54a}
.tc header{display:flex;align-items:center;justify-content:space-between}
.tc h3{font-family:var(--head);font-weight:400;font-size:22px;margin:0;color:var(--felt)}
.tst{font-size:12.5px;font-weight:800;background:#e7efe9;border-radius:999px;padding:2px 10px}
.tst.warn{background:#ff7a59;color:#fff}
.tc ul{list-style:none;margin:0;padding:0;flex:1;min-height:96px}
.tc li{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:9px;font-size:15px}
.tc li.now{background:#FFF3C4}
.tc li.none{color:#8a959d;font-size:13.5px}
.tc li b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc li span:last-child{font-weight:900}
.od{flex:none;width:10px;height:10px;border-radius:50%;background:#c0392b}
.od.on{background:#27ae60}
.tn{font-style:normal;font-size:11.5px;font-weight:900;background:#ffd54a;border-radius:999px;padding:0 7px}
.tc-btns{display:flex;flex-wrap:wrap;gap:6px}
.tc-btns .btn{box-shadow:0 2px 0 var(--ink);min-height:36px;font-size:13px;padding:3px 10px}

.stepper{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper .btn{width:52px;min-height:52px;padding:0;font-size:26px;line-height:1}
.stepper input{width:92px;border:2.5px solid var(--ink);border-radius:14px;font:inherit;font-family:var(--head);font-size:30px;text-align:center;padding:5px 6px;background:#fff}
.stepper .unit{font-weight:900;font-size:17px}
.stepper .hint{margin-left:6px}

</style>
</head>

<script>
/* 출동! AI 구조대 — 서버(Firebase Realtime Database) 연결
   저장 구조
   classes/{수업코드 4자리}
     meta   : { host, created, goal, tables }
     tables/{t1..t8}
       seats/{s0..s3} : { uid, name }        자리에 앉은 학생
       on/{uid}       : true                 지금 접속 중인 기기 (끊기면 자동 삭제)
       game           : { rev, json, turnSeat, phase }   게임 상태(json은 규칙 엔진의 state)
*/
(function (root) {
  'use strict';
  var G = root.Game;
  var fb = root.__MOCK_FB || root.firebase;
  var cfg = root.FIREBASE_CONFIG;
  var db = null, auth = null, uid = null, watchers = [], presence = null;

  var Net = { ready: !!(fb && cfg), uid: null, error: '' };

  function ref(path) { return db.ref(path); }
  function tpath(code, t) { return 'classes/' + code + '/tables/t' + t; }
  function fail(e) {
    var m = (e && (e.code || e.message)) || String(e);
    if (/PERMISSION_DENIED|permission_denied/i.test(m)) return new Error('권한이 없어요. 내 차례가 맞는지 확인해요.');
    if (/network|disconnect|offline/i.test(m)) return new Error('인터넷 연결을 확인해요.');
    return e instanceof Error ? e : new Error(m);
  }

  /* 익명 로그인: 학생은 아무것도 입력하지 않아도 기기마다 고유한 번호(uid)를 받습니다. */
  Net.init = function (cb) {
    if (!Net.ready) { cb(null); return; }
    try {
      if (!fb.apps || !fb.apps.length) fb.initializeApp(cfg);
      auth = fb.auth(); db = fb.database();
    } catch (e) { Net.ready = false; Net.error = String(e.message || e); cb(null); return; }
    var done = false;
    auth.onAuthStateChanged(function (u) {
      if (u) { uid = Net.uid = u.uid; if (!done) { done = true; cb(uid); } }
      else auth.signInAnonymously().catch(function (e) { Net.error = String(e.message || e); if (!done) { done = true; cb(null); } });
    });
  };

  Net.watch = function (path, cb) {
    var r = ref(path), fn = function (snap) { cb(snap.val()); };
    r.on('value', fn, function (e) { cb(null, fail(e)); });
    var w = { off: function () { r.off('value', fn); } };
    watchers.push(w); return w;
  };
  Net.unwatchAll = function () { watchers.forEach(function (w) { w.off(); }); watchers = []; Net.offline(); };
  Net.watchClass = function (code, cb) { return Net.watch('classes/' + code, cb); };
  Net.watchTable = function (code, t, cb) { return Net.watch(tpath(code, t), cb); };
  Net.getMeta = function (code) {
    return ref('classes/' + code + '/meta').once('value').then(function (s) { return s.val(); }).catch(function (e) { throw fail(e); });
  };

  /* 선생님: 수업 방 만들기. 겹치지 않는 4자리 코드를 찾아 만듭니다. */
  Net.createClass = function (opt) {
    var tries = 0;
    function attempt() {
      var code = String(1000 + Math.floor(Math.random() * 9000));
      var meta = { host: uid, created: fb.database.ServerValue.TIMESTAMP, goal: opt.goal === 20 ? 20 : 12, tables: opt.tables };

  Net.removeClass = function (code) { return ref('classes/' + code).remove().catch(function (e) { throw fail(e); }); };

  /* 접속 표시: 연결되면 on/{uid}=true, 끊기면 서버가 알아서 지웁니다. */
  Net.online = function (code, t) {
    Net.offline();
    var mine = ref(tpath(code, t) + '/on/' + uid), conn = ref('.info/connected');
    var fn = function (snap) {
      if (snap.val() === true) { mine.onDisconnect().remove(); mine.set(true); }
    };
    conn.on('value', fn);
    presence = { stop: function () { conn.off('value', fn); mine.remove(); } };
  };
  Net.offline = function () { if (presence) { try { presence.stop(); } catch (e) { } presence = null; } };

  Net.sit = function (code, t, seat, name) {
    return ref(tpath(code, t) + '/seats/s' + seat).set({ uid: uid, name: name }).catch(function () {
      throw new Error('다른 친구가 먼저 앉았어요. 다른 자리를 골라요.');
    });
  };
  Net.leave = function (code, t, seat) { return ref(tpath(code, t) + '/seats/s' + seat).remove().catch(function () { }); };

  function pack(s, rev) {
    return { rev: rev, json: JSON.stringify(s), turnSeat: 's' + s.seatOf[s.turn], phase: s.phase };
  }

  /* 새 게임 시작(대기 중이거나 끝난 모둠에서만). seats: [{seat,name}] */
  Net.startGame = function (code, t, seated, goal) {
    var s = G.newGame({ names: seated.map(function (x) { return x.name; }), goal: goal });
    s.seatOf = seated.map(function (x) { return x.seat; });
    return ref(tpath(code, t) + '/game').transaction(function (cur) {
      if (cur && cur.phase !== 'end') return;           // 이미 누가 시작했음
      return pack(s, (cur && cur.rev || 0) + 1);
    }).then(function (r) { return r.committed; }, function (e) { throw fail(e); });
  };

  /* 행동 보내기: 서버의 최신 상태에 규칙 엔진을 적용해 한 번에 바꿉니다(트랜잭션).
     두 기기가 동시에 눌러도 먼저 도착한 하나만 반영됩니다. */
  Net.act = function (code, t, rev, action) {
    var err = null;
    return ref(tpath(code, t) + '/game').transaction(function (cur) {
      err = null;
      if (!cur) return cur;
      if (cur.rev !== rev) { err = new Error('방금 판이 바뀌었어요. 다시 해 봐요.'); return; }
      try {
        var s = JSON.parse(cur.json), seatOf = s.seatOf;
        s = G.act(s, action); s.seatOf = seatOf;
        return pack(s, cur.rev + 1);
      } catch (e) { err = e; return; }
    }).then(function (r) {
      if (!r.committed) throw err || new Error('반영되지 않았어요. 다시 해 봐요.');
      return true;
    }, function (e) { throw fail(e); });
  };
  Net.clearGame = function (code, t) { return ref(tpath(code, t) + '/game').remove().catch(function (e) { throw fail(e); }); };
  Net.clearTable = function (code, t) { return ref(tpath(code, t)).remove().catch(function (e) { throw fail(e); }); };

  root.Net = Net;
})(window);

</script>

      /* 첫 화면 */
      case 'join': if (ui.code.length !== 4) { toast('수업 코드는 숫자 4자리예요.'); return; } joinClass(ui.code); return;
      case 'local': ui.screen = 'setup'; ui.saved = lsGet(SAVE_KEY); if (ui.saved && (ui.saved.v !== 1 || ui.saved.phase === 'end')) ui.saved = null; break;
      case 'tnew': ui.screen = 'tnew'; break;
      case 'tdec': ui.tables = Math.max(1, (+ui.tables || 2) - 1); break;
      case 'tinc': ui.tables = Math.min(MAX_TABLES, (+ui.tables || 0) + 1); break;
      case 'tcreate':
        if (!ui.tables) { toast('모둠 수를 1~' + MAX_TABLES + ' 사이로 적어요.'); return; }
        if (ctx.busy) return; ctx.busy = true;
        Net.createClass({ tables: +ui.tables, goal: ui.goal }).then(function (code) { ctx.busy = false; joinClass(code); }, function (e) { ctx.busy = false; toast(esc(e.message)); });
        return;
      case 'home': goHome(); break;
      /* 기기 한 대 */
      case 'n': ui.n = +d.v; break;
      case 'goal': ui.goal = +d.v; break;
      case 'start': startLocal({ names: names(), goal: ui.goal }); break;
      case 'resume': mode = 'local'; state = ui.saved; ui.saved = null; ui.screen = 'game'; ui.modal = null; if (state.phase === 'discard') openDiscard(); break;
      case 'again': startLocal({ names: state.players.map(function (p) { return p.name; }), goal: state.goal }); break;
      /* 학생: 모둠 */
      case 'table': if (!(ui.name || '').trim()) { toast('이름을 먼저 적어요.'); var nm = document.getElementById('nm'); if (nm) nm.focus(); return; } enterTable(+d.t, true); return;
      case 'sit': sit(+d.i); return;
      case 'stand': Net.leave(ctx.code, ctx.t, mySeat()); return;
      case 'asktake': ui.modal = { type: 'take', i: +d.i }; break;
      case 'take-ok': ui.modal = null; sit(+d.i); break;
      case 'topick':
        var g0 = ctx.tab && ctx.tab.game, m0 = mySeat();
        if (m0 >= 0 && !(g0 && g0.phase !== 'end')) Net.leave(ctx.code, ctx.t, m0);
        joinClass(ctx.code); return;
      case 'ostart': startOnline(); return;
      case 'togame': if (state) { ui.screen = 'game'; ui.modal = null; if (state.phase === 'discard' && canAct()) openDiscard(); } break;
      case 'tolobby': ui.screen = 'table'; ui.modal = null; ui.picks = []; break;
      /* 선생님 */
      case 't-watch': ctx.t = +d.t; ctx.rev = 0; state = null; ui.screen = 'game'; ui.modal = null; onTable(ctx.cls.tables && ctx.cls.tables['t' + ctx.t] || null); return;
      case 't-back': ctx.t = 0; state = null; ctx.rev = 0; ui.screen = 'teacher'; ui.modal = null; break;
      case 't-pass': tAct(+d.t, { t: 'pass' }); toast(d.t + '모둠의 차례를 넘겼어요.'); return;
      case 't-last': tAct(+d.t, { t: 'lastRound' }); return;
      case 'all-last': for (var t = 1; t <= ctx.cls.meta.tables; t++) { var c = tgame(t); if (c && c.s.phase !== 'end' && !c.s.ending) tAct(t, { t: 'lastRound' }); } toast('모든 모둠에 "이번 라운드까지"를 알렸어요.'); return;
      case 't-askclear': ui.modal = { type: 'tclear', t: +d.t }; break;
      case 't-clear': ui.modal = null; Net.clearTable(ctx.code, +d.t).catch(function (e) { toast(esc(e.message)); }); break;
      case 'askend': ui.modal = { type: 'tend' }; break;
      case 'class-end': var code = ctx.code; Net.unwatchAll(); Net.removeClass(code).then(function () { toast('수업을 끝냈어요.'); }, function (e) { toast(esc(e.message)); }); goHome(); break;
      /* 게임 */
      case 'pick': pick(+d.r); break;
      case 'clear': ui.picks = []; break;
      case 'take': send({ t: 'take', picks: ui.picks.slice() }); return;
      case 'askpass': ui.modal = { type: 'pass' }; break;
      case 'pass': send({ t: 'pass' }); return;
      case 'card': ui.modal = { type: 'card', id: d.id }; break;
      case 'deploy': send({ t: 'deploy', card: d.id }); return;
      case 'give': ui.give[+d.r] += +d.d; break;
      case 'discard': send({ t: 'discard', give: ui.give.slice() }); return;
      case 'who': ui.modal = { type: 'who', p: +d.p }; break;
      case 'rules': ui.modal = { type: 'rules', back: ui.modal && ui.modal.type === 'menu' }; break;
      case 'menu': ui.modal = { type: 'menu' }; break;
      case 'asknew': ui.modal = { type: 'new' }; break;
      case 'lastRound': send({ t: 'lastRound' }); ui.modal = null; toast('이번 라운드까지 하고 끝내요.'); render(); return;
      case 'close': ui.modal = null; break;
    }
    render();
  }

  /* ---------- 시작 ---------- */
  ui.name = lsGet(NAME_KEY) || '';
  render();
  if (Net.ready) {
    Net.init(function (uid) {
      ui.netState = uid ? 'ok' : 'fail';
      var sess = uid && lsGet(SESS_KEY);
      if (sess && sess.code && ui.screen === 'home') {
        /* 새로고침하거나 기기를 다시 켰을 때: 하던 수업과 모둠으로 돌아갑니다. */
        Net.getMeta(sess.code).then(function (meta) {
          if (!meta || ui.screen !== 'home') { if (!meta) lsSet(SESS_KEY, null); render(); return; }
          ctx.code = sess.code; ctx.goal = meta.goal; mode = 'online'; ctx.cls = { meta: meta };
          if (meta.host === uid) { ctx.role = 't'; ui.screen = 'teacher'; Net.watchClass(sess.code, onClass); render(); }
          else { ctx.role = 's'; if (sess.t) enterTable(sess.t, false); else { ui.screen = 'pick'; Net.watchClass(sess.code, onClass); render(); } }
        }, function () { render(); });
      } else render();
    });
  } else ui.netState = 'fail';
  window.__dbg = { get state() { return state; }, get ctx() { return ctx; }, ui: ui, render: render, send: send, get mode() { return mode; }, myIdx: myIdx, canAct: canAct };
})();

</script>
</body>
</html>
